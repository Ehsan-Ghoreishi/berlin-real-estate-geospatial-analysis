[project]
name = "berlin-real-estate"
version = "0.4.0"
description = "Berlin housing market ETL, geospatial feature engineering, price modelling and policy-shock analysis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ehsan Ghoreishi" }]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
# matplotlib.use("Agg") must run before pyplot is imported
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py"]
# pandas/sklearn/geopandas ship without complete type information
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
